# ─────────────────────────────────────────────────────────────
#  ReconX — Configuration File
#  
#  SETUP INSTRUCTIONS:
#    1. Copy this file:   cp config.example.ini config.ini
#    2. Fill in your API keys below
#    3. config.ini is git-ignored — your keys stay private
# ─────────────────────────────────────────────────────────────

[api_keys]

# Shodan API Key
# Get yours free at: https://account.shodan.io/
# Free tier supports basic host lookups (no scan credits needed for recon)
SHODAN_API_KEY = YOUR_SHODAN_API_KEY_HERE


# ─────────────────────────────────────────────────────────────
# Optional / Future Keys (leave blank if not using)
# ─────────────────────────────────────────────────────────────

# Hunter.io — email discovery (https://hunter.io/api)
# HUNTER_API_KEY =

# SecurityTrails — subdomain history (https://securitytrails.com)
# SECURITYTRAILS_API_KEY =

# VirusTotal — domain intel (https://www.virustotal.com/gui/my-apikey)
# VIRUSTOTAL_API_KEY =


[settings]

# Default thread count for DNS brute force (1–50 recommended)
threads = 10

# Request timeout in seconds
timeout = 10

# Default report format: html | pdf | both | json
report_format = both

# Default output directory for reports
output_dir = reports/output
